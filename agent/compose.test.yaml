x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-agent-image: &agent-image
  build:
    context: ..
    dockerfile: deploy/core/Dockerfile.agent
  image: ${THESISTRACE_AGENT_TEST_IMAGE}

services:
  postgres:
    image: postgres:16.10-alpine
    logging: *bounded-logging
    environment:
      POSTGRES_DB: thesistrace
      POSTGRES_USER: thesistrace_owner
      POSTGRES_PASSWORD: owner-test-password
      THESISTRACE_CORE_DATABASE_PASSWORD: core-test-password
      THESISTRACE_AUTH_DATABASE_PASSWORD: auth-test-password
      THESISTRACE_AGENT_DATABASE_PASSWORD: agent-test-password
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = postgres && pg_isready -U thesistrace_owner -d thesistrace
      interval: 1s
      timeout: 5s
      retries: 60
    ports:
      - 127.0.0.1::5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../deploy/core/postgres-init/010-runtime-roles.sh:/docker-entrypoint-initdb.d/010-runtime-roles.sh:ro
      - ./test-fixtures/hold-postgres-initialization:/docker-entrypoint-initdb.d/099-hold-postgres-initialization.sh:ro

  auth-stub:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    logging: *bounded-logging
    command:
      - node
      - --input-type=module
      - --eval
      - >-
        import http from 'node:http';
        const researcher={active:true,display_label:'Image Researcher',email:'image@example.test',researcher_id:'00000000-0000-4000-8000-000000000101'};
        http.createServer((request,response)=>{if(request.method!=='POST'||request.url!=='/internal/session/verify'){response.writeHead(404).end();return;}if(request.headers.cookie!=='session=valid'){response.writeHead(401).end();return;}response.writeHead(200,{'content-type':'application/json'}).end(JSON.stringify(researcher));}).listen(8200,'0.0.0.0');
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8200/internal/session/verify',{method:'POST',headers:{cookie:'session=valid'}}).then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60

  agent-initialize:
    <<: *agent-image
    logging: *bounded-logging
    command: ["node", "dist/initialize.js"]
    environment:
      THESISTRACE_OWNER_DATABASE_URL: postgresql://thesistrace_owner:owner-test-password@postgres:5432/thesistrace
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    <<: *agent-image
    logging: *bounded-logging
    environment:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      THESISTRACE_AGENT_BUILD_REVISION: image-smoke
      THESISTRACE_AGENT_DATABASE_URL: postgresql://agent_runtime:agent-test-password@postgres:5432/thesistrace
      THESISTRACE_AGENT_MODEL_REGISTRY: ${THESISTRACE_AGENT_TEST_MODEL_REGISTRY:?THESISTRACE_AGENT_TEST_MODEL_REGISTRY is required}
      THESISTRACE_AGENT_SCRIPTED_MODEL_SECRET: ${THESISTRACE_AGENT_TEST_SCRIPTED_SECRET:?THESISTRACE_AGENT_TEST_SCRIPTED_SECRET is required}
      THESISTRACE_AUTH_INTERNAL_ORIGIN: http://auth-stub:8200
      THESISTRACE_ENVIRONMENT: production
      THESISTRACE_PUBLIC_ORIGIN: https://thesistrace.test
    depends_on:
      agent-initialize:
        condition: service_completed_successfully
      auth-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8400/health/ready').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    ports:
      - 127.0.0.1::8400

volumes:
  postgres-data:
