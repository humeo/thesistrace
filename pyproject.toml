[project]
name = "thesistrace"
version = "0.1.0"
description = "Reproducible post-close A-share research workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "psycopg[binary,pool]>=3.2.10,<4",
  "pyarrow==25.0.0",
  "uvicorn[standard]>=0.35.0,<1",
  "boto3>=1.40,<2",
  "cryptography>=50,<51",
  "numpy>=2.3,<3",
  "akshare==1.18.94",
  "mcp>=2,<3",
]

[project.scripts]
thesistrace-core-api = "thesistrace.entrypoints.http:main"
thesistrace-core-diagnose = "thesistrace.entrypoints.diagnose:main"
thesistrace-core-worker = "thesistrace.entrypoints.worker:main"
thesistrace-initialize = "thesistrace.entrypoints.initialize:main"
thesistrace-data-operator = "thesistrace.entrypoints.data_operator:main"
thesistrace-research-agent-mcp = "thesistrace.entrypoints.research_agent_mcp:main"

[dependency-groups]
dev = [
  "jsonschema>=4.26,<5",
  "pyjwt>=2.13,<3",
  "pytest>=8.4.1,<9",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesistrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "database_restart: isolated final-phase acceptance that restarts its owned PostgreSQL",
  "dependency_restart: isolated final-phase acceptance that stops and restarts owned dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
