[project]
name = "thesistrace"
version = "0.1.0"
description = "Reproducible post-close A-share research workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "psycopg[binary]>=3.2.10,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "pyarrow==25.0.0",
  "uvicorn[standard]>=0.35.0,<1",
  "temporalio==1.30.0",
  "opentelemetry-sdk>=1.38.0,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.38.0,<2",
]

[project.scripts]
thesistrace-api = "thesistrace.api:main"
thesistrace-operator = "thesistrace.operator:main"
thesistrace-worker = "thesistrace.worker:main"
thesistrace-execution-relay = "thesistrace.hosted.execution_relay:main"
thesistrace-temporal-worker = "thesistrace.hosted.temporal_worker:main"
thesistrace-data-worker = "thesistrace.hosted.data_worker:main"
thesistrace-object-store = "thesistrace.hosted.object_store_service:main"
thesistrace-tushare-egress = "thesistrace.hosted.tushare_egress:main"
thesistrace-health-service = "thesistrace.hosted.health_service:main"
thesistrace-release = "thesistrace.hosted.release_cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "ruff>=0.12.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesistrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
