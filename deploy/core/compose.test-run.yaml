x-test-environment: &test-environment
  THESISTRACE_DATABASE_URL: postgresql://core_runtime:${THESISTRACE_CORE_DATABASE_PASSWORD}@postgres:5432/thesistrace
  THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN}
  THESISTRACE_S3_ENDPOINT_URL: http://rustfs:9000
  THESISTRACE_S3_ACCESS_KEY_ID: rustfsadmin
  THESISTRACE_S3_SECRET_ACCESS_KEY: rustfsadmin
  THESISTRACE_S3_BUCKET: ${THESISTRACE_TEST_BUCKET:-thesistrace-test}
  THESISTRACE_S3_REGION: us-east-1
  THESISTRACE_DATA_MOUNT: /var/lib/thesistrace/canonical-data
  THESISTRACE_BENCHMARK_MOUNT: /var/lib/thesistrace/benchmark-data
  THESISTRACE_INTERNAL_API_ORIGIN: http://api:8100
  THESISTRACE_BATCH_ATTEMPT_CONTROL_DIRECTORY: /var/lib/thesistrace/.batch-attempts

services:
  resend-fake:
    image: node:24.14.0-bookworm-slim
    command: ["node", "/test-fixtures/resend-fake.mjs"]
    environment:
      THESISTRACE_RESEND_FAKE_HOST: 0.0.0.0
      THESISTRACE_RESEND_FAKE_MODE: success
      THESISTRACE_RESEND_FAKE_PORT: "8300"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8300/health/live').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro
    ports:
      - 127.0.0.1::8300

  auth:
    depends_on:
      resend-fake:
        condition: service_healthy
    ports:
      - 127.0.0.1::8200
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro

  postgres:
    command:
      - postgres
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=2GB
    ports:
      - 127.0.0.1::5432

  rustfs:
    ports:
      - 127.0.0.1::9000

  initialize:
    environment:
      <<: *test-environment
      THESISTRACE_DATABASE_URL: postgresql://thesistrace_owner:${THESISTRACE_OWNER_DATABASE_PASSWORD}@postgres:5432/thesistrace

  api:
    environment:
      <<: *test-environment
      THESISTRACE_AUTH_INTERNAL_ORIGIN: http://auth:8200
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/var/lib/thesistrace/benchmark-data

  research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro

  batch-research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro
      - ${THESISTRACE_TEST_BATCH_ATTEMPT_CONTROL_DIRECTORY}:/var/lib/thesistrace/.batch-attempts

  tracking-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  data-operator-worker:
    command:
      - thesistrace-data-operator
      - worker
      - --replay
      - /test-fixtures/tushare-financial-market-refresh-replay.json
      - --replay
      - /test-fixtures/tushare-operator-console-market-refresh-replay.json
      - --replay
      - /test-fixtures/tushare-image-smoke-market-refresh-replay.json
    environment:
      <<: *test-environment
      THESISTRACE_TUSHARE_TOKEN: ${THESISTRACE_TUSHARE_TOKEN}
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/var/lib/thesistrace/benchmark-data
      - ../../tests/fixtures:/test-fixtures:ro

  web:
    ports:
      - 127.0.0.1:${THESISTRACE_TEST_CADDY_PORT}:${THESISTRACE_TEST_CADDY_PORT}
