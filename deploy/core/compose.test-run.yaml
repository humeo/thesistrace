x-test-environment: &test-environment
  THESISTRACE_DATABASE_URL: postgresql://core_runtime:${THESISTRACE_CORE_DATABASE_PASSWORD}@postgres:5432/thesistrace
  THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN}
  THESISTRACE_S3_ENDPOINT_URL: http://rustfs:9000
  THESISTRACE_S3_ACCESS_KEY_ID: rustfsadmin
  THESISTRACE_S3_SECRET_ACCESS_KEY: rustfsadmin
  THESISTRACE_S3_BUCKET: ${THESISTRACE_TEST_BUCKET:-thesistrace-test}
  THESISTRACE_S3_REGION: us-east-1
  THESISTRACE_DATA_MOUNT: /var/lib/thesistrace/canonical-data
  THESISTRACE_BENCHMARK_MOUNT: /var/lib/thesistrace/benchmark-data
  THESISTRACE_INTERNAL_API_ORIGIN: http://api:8100
  THESISTRACE_BATCH_ATTEMPT_CONTROL_DIRECTORY: /var/lib/thesistrace/.batch-attempts

services:
  resend-fake:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    command: ["node", "/test-fixtures/resend-fake.mjs"]
    environment:
      THESISTRACE_RESEND_FAKE_HOST: 0.0.0.0
      THESISTRACE_RESEND_FAKE_MODE: success
      THESISTRACE_RESEND_FAKE_PORT: "8300"
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8300/health/live').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro
    ports:
      - 127.0.0.1::8300

  auth:
    depends_on:
      resend-fake:
        condition: service_healthy
    ports:
      - 127.0.0.1::8200
      - 127.0.0.1::8260
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro

  auth-fixture-control:
    image: ${THESISTRACE_AUTH_IMAGE:?THESISTRACE_AUTH_IMAGE is required}
    command: ["node", "/test-fixtures/auth-control.mjs"]
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      THESISTRACE_AUTH_DATABASE_URL: postgresql://auth_runtime:${THESISTRACE_AUTH_DATABASE_PASSWORD:?THESISTRACE_AUTH_DATABASE_PASSWORD is required}@postgres:5432/thesistrace
      THESISTRACE_AUTH_FIXTURE_CONTROL_PORT: "8260"
      THESISTRACE_ENVIRONMENT: test
      THESISTRACE_AGENT_RUN_MAX_WALL_SECONDS: ${THESISTRACE_AGENT_RUN_MAX_WALL_SECONDS:?THESISTRACE_AGENT_RUN_MAX_WALL_SECONDS is required}
      THESISTRACE_MCP_ACCESS_TOKEN_TTL_SECONDS: ${THESISTRACE_MCP_ACCESS_TOKEN_TTL_SECONDS:?THESISTRACE_MCP_ACCESS_TOKEN_TTL_SECONDS is required}
      THESISTRACE_MCP_AGENT_SCOPES: ${THESISTRACE_MCP_AGENT_SCOPES:?THESISTRACE_MCP_AGENT_SCOPES is required}
      THESISTRACE_MCP_CLIENT_ID: ${THESISTRACE_MCP_CLIENT_ID:?THESISTRACE_MCP_CLIENT_ID is required}
      THESISTRACE_MCP_CLOCK_SKEW_SECONDS: ${THESISTRACE_MCP_CLOCK_SKEW_SECONDS:?THESISTRACE_MCP_CLOCK_SKEW_SECONDS is required}
      THESISTRACE_MCP_ISSUER_URL: ${THESISTRACE_MCP_ISSUER_URL:?THESISTRACE_MCP_ISSUER_URL is required}
      THESISTRACE_MCP_RESOURCE_URL: ${THESISTRACE_MCP_RESOURCE_URL:?THESISTRACE_MCP_RESOURCE_URL is required}
      THESISTRACE_MCP_SIGNING_PRIVATE_JWK: ${THESISTRACE_MCP_SIGNING_PRIVATE_JWK:?THESISTRACE_MCP_SIGNING_PRIVATE_JWK is required}
      THESISTRACE_MCP_VERIFYING_PUBLIC_JWK: ${THESISTRACE_MCP_VERIFYING_PUBLIC_JWK:?THESISTRACE_MCP_VERIFYING_PUBLIC_JWK is required}
      THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN:?THESISTRACE_PUBLIC_ORIGIN is required}
      THESISTRACE_RESEND_API_URL: ${THESISTRACE_RESEND_API_URL:?THESISTRACE_RESEND_API_URL is required}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8260/health/ready').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    network_mode: service:auth
    restart: "no"
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro

  auth-exchange-proxy:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    command: ["node", "/test-fixtures/auth-exchange-proxy.mjs"]
    environment:
      THESISTRACE_AUTH_PROXY_PORT: "8250"
      THESISTRACE_AUTH_PROXY_UPSTREAM: http://auth:8200
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8250/health/live').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ../../auth/test-fixtures:/test-fixtures:ro
    ports:
      - 127.0.0.1::8250

  mcp-fault-proxy:
    image: node:24.14.0-bookworm-slim@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    command: ["node", "/test-fixtures/mcp-fault-proxy.mjs"]
    environment:
      THESISTRACE_MCP_PROXY_PORT: "8150"
      THESISTRACE_MCP_PROXY_UPSTREAM: http://api:8100
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8150/health/live').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ../../agent/test-fixtures:/test-fixtures:ro
    ports:
      - 127.0.0.1::8150

  agent:
    environment:
      OPENAI_BASE_URL: ${THESISTRACE_AGENT_OPENAI_BASE_URL:?THESISTRACE_AGENT_OPENAI_BASE_URL is required}
      THESISTRACE_AUTH_INTERNAL_ORIGIN: http://auth-exchange-proxy:8250
      THESISTRACE_MCP_INTERNAL_URL: http://mcp-fault-proxy:8150/mcp
    depends_on:
      auth-exchange-proxy:
        condition: service_healthy
      mcp-fault-proxy:
        condition: service_healthy

  postgres:
    command:
      - postgres
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=2GB
    ports:
      - 127.0.0.1::5432

  rustfs:
    ports:
      - 127.0.0.1::9000

  initialize:
    environment:
      <<: *test-environment
      THESISTRACE_DATABASE_URL: postgresql://thesistrace_owner:${THESISTRACE_OWNER_DATABASE_PASSWORD}@postgres:5432/thesistrace

  api:
    environment:
      <<: *test-environment
      THESISTRACE_AUTH_INTERNAL_ORIGIN: http://auth:8200
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/var/lib/thesistrace/benchmark-data

  research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro

  batch-research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro
      - ${THESISTRACE_TEST_BATCH_ATTEMPT_CONTROL_DIRECTORY}:/var/lib/thesistrace/.batch-attempts

  tracking-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  data-operator-worker:
    command:
      - thesistrace-data-operator
      - worker
      - --replay
      - /test-fixtures/tushare-financial-market-refresh-replay.json
      - --replay
      - /test-fixtures/tushare-operator-console-market-refresh-replay.json
      - --replay
      - /test-fixtures/tushare-operator-console-market-no-change-replay.json
      - --replay
      - /test-fixtures/tushare-image-smoke-market-refresh-replay.json
    environment:
      <<: *test-environment
      THESISTRACE_TUSHARE_TOKEN: ${THESISTRACE_TUSHARE_TOKEN}
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/var/lib/thesistrace/benchmark-data
      - ../../tests/fixtures:/test-fixtures:ro

  web:
    ports:
      - 127.0.0.1:${THESISTRACE_TEST_CADDY_PORT}:${THESISTRACE_TEST_CADDY_PORT}
