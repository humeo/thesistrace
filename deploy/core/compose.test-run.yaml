x-test-environment: &test-environment
  THESISTRACE_DATABASE_URL: postgresql://thesistrace:thesistrace-test@postgres:5432/thesistrace
  THESISTRACE_S3_ENDPOINT_URL: http://rustfs:9000
  THESISTRACE_S3_ACCESS_KEY_ID: rustfsadmin
  THESISTRACE_S3_SECRET_ACCESS_KEY: rustfsadmin
  THESISTRACE_S3_BUCKET: ${THESISTRACE_TEST_BUCKET:-thesistrace-test}
  THESISTRACE_S3_REGION: us-east-1
  THESISTRACE_DATA_MOUNT: /var/lib/thesistrace/canonical-data

services:
  postgres:
    command:
      - postgres
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_DB: thesistrace
      POSTGRES_USER: thesistrace
      POSTGRES_PASSWORD: thesistrace-test
    ports:
      - 127.0.0.1::5432

  rustfs:
    ports:
      - 127.0.0.1::9000

  initialize:
    environment: *test-environment

  api:
    environment:
      <<: *test-environment
    ports:
      - 127.0.0.1::8100
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  tracking-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  web:
    ports:
      - 127.0.0.1::5173
