x-test-environment: &test-environment
  THESISTRACE_DATABASE_URL: postgresql://core_runtime:${THESISTRACE_CORE_DATABASE_PASSWORD}@postgres:5432/thesistrace
  THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN}
  THESISTRACE_S3_ENDPOINT_URL: http://rustfs:9000
  THESISTRACE_S3_ACCESS_KEY_ID: rustfsadmin
  THESISTRACE_S3_SECRET_ACCESS_KEY: rustfsadmin
  THESISTRACE_S3_BUCKET: ${THESISTRACE_TEST_BUCKET:-thesistrace-test}
  THESISTRACE_S3_REGION: us-east-1
  THESISTRACE_DATA_MOUNT: /var/lib/thesistrace/canonical-data
  THESISTRACE_BATCH_ATTEMPT_CONTROL_DIRECTORY: /var/lib/thesistrace/.batch-attempts

services:
  postgres:
    command:
      - postgres
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=2GB
    ports:
      - 127.0.0.1::5432

  rustfs:
    ports:
      - 127.0.0.1::9000

  initialize:
    environment:
      <<: *test-environment
      THESISTRACE_DATABASE_URL: postgresql://thesistrace_owner:${THESISTRACE_OWNER_DATABASE_PASSWORD}@postgres:5432/thesistrace

  api:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro

  batch-research-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro
      - ${THESISTRACE_TEST_BATCH_ATTEMPT_CONTROL_DIRECTORY}:/var/lib/thesistrace/.batch-attempts

  tracking-worker:
    environment:
      <<: *test-environment
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data

  web:
    ports:
      - 127.0.0.1:${THESISTRACE_TEST_CADDY_PORT}:${THESISTRACE_TEST_CADDY_PORT}
