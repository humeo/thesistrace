networks:
  default:
    internal: true

services:
  initialize:
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/smoke-evidence
      - ../../tests:/smoke:ro
      - ../../scripts:/qualification:ro
      - ../../benchmarks:/benchmarks:ro
  research-worker:
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/var/lib/thesistrace/canonical-data:ro
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/qualification-evidence
      - ../../scripts:/qualification:ro
      - ../../benchmarks:/benchmarks:ro
