networks:
  default:
    internal: true

services:
  rustfs:
    environment:
      RUSTFS_ACCESS_KEY: observability-access-canary
      RUSTFS_SECRET_KEY: observability-secret-canary

  initialize:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_RUN_ROOT}:/smoke-data
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/smoke-evidence
      - ../../tests:/smoke:ro
      - ../../scripts:/qualification:ro
      - ../../benchmarks:/benchmarks:ro
  api:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_RUN_ROOT}:/smoke-data
  research-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_RUN_ROOT}:/smoke-data:ro
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/qualification-evidence
      - ../../scripts:/qualification:ro
      - ../../benchmarks:/benchmarks:ro
  batch-research-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_RUN_ROOT}:/smoke-data:ro
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/qualification-evidence
      - ../../scripts:/qualification:ro
      - ../../benchmarks:/benchmarks:ro
  tracking-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_RUN_ROOT}:/smoke-data
