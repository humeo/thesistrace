services:
  postgres:
    ports:
      - 127.0.0.1:${THESISTRACE_DEV_POSTGRES_PORT}:5432

  rustfs:
    ports:
      - 127.0.0.1:${THESISTRACE_DEV_S3_PORT}:9000
      - 127.0.0.1:${THESISTRACE_DEV_S3_CONSOLE_PORT}:9001

  api:
    command:
      - uvicorn
      - --factory
      - thesistrace.entrypoints.http:create_production_app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --no-access-log
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - 127.0.0.1:${THESISTRACE_DEV_API_PORT}:8100
    develop:
      watch:
        - path: ../../src
          action: sync
          target: /app/src
          initial_sync: true
          ignore:
            - thesistrace/entrypoints/worker.py
        - path: ../../pyproject.toml
          action: rebuild
        - path: ../../uv.lock
          action: rebuild
        - path: ./Dockerfile.backend
          action: rebuild

  auth:
    develop:
      watch:
        - path: ../../auth
          action: rebuild
        - path: ../../package.json
          action: rebuild
        - path: ../../pnpm-lock.yaml
          action: rebuild
        - path: ../../pnpm-workspace.yaml
          action: rebuild
        - path: ./Dockerfile.auth
          action: rebuild

  agent:
    develop:
      watch:
        - path: ../../agent
          action: rebuild
        - path: ../../package.json
          action: rebuild
        - path: ../../pnpm-lock.yaml
          action: rebuild
        - path: ../../pnpm-workspace.yaml
          action: rebuild
        - path: ./Dockerfile.agent
          action: rebuild

  research-worker:
    develop:
      watch:
        - path: ../../src
          action: sync+restart
          target: /app/src
          initial_sync: true
          ignore:
            - thesistrace/entrypoints/http.py
            - thesistrace/entrypoints/initialize.py
        - path: ../../pyproject.toml
          action: rebuild
        - path: ../../uv.lock
          action: rebuild
        - path: ./Dockerfile.backend
          action: rebuild

  batch-research-worker:
    develop:
      watch:
        - path: ../../src
          action: sync+restart
          target: /app/src
          initial_sync: true
          ignore:
            - thesistrace/entrypoints/http.py
            - thesistrace/entrypoints/initialize.py
        - path: ../../pyproject.toml
          action: rebuild
        - path: ../../uv.lock
          action: rebuild
        - path: ./Dockerfile.backend
          action: rebuild

  tracking-worker:
    develop:
      watch:
        - path: ../../src
          action: sync+restart
          target: /app/src
          initial_sync: true
          ignore:
            - thesistrace/entrypoints/http.py
            - thesistrace/entrypoints/initialize.py
        - path: ../../pyproject.toml
          action: rebuild
        - path: ../../uv.lock
          action: rebuild
        - path: ./Dockerfile.backend
          action: rebuild

  web:
    ports:
      - 127.0.0.1:${THESISTRACE_DEV_WEB_PORT}:5173
    develop:
      watch:
        - path: ../../web
          action: rebuild
        - path: ../../package.json
          action: rebuild
        - path: ../../pnpm-lock.yaml
          action: rebuild
        - path: ../../pnpm-workspace.yaml
          action: rebuild
        - path: ../../web/package.json
          action: rebuild
        - path: ./Dockerfile.web
          action: rebuild
