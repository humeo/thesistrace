services:
  postgres:
    image: postgres:16.10-alpine
    network_mode: bridge
    environment:
      POSTGRES_DB: thesistrace
      POSTGRES_USER: thesistrace
      POSTGRES_PASSWORD: thesistrace-test
    ports:
      - "${THESISTRACE_CORE_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesistrace -d thesistrace"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ${THESISTRACE_CORE_TEST_DATA_ROOT:-/private/tmp/thesistrace-core-test-data}/postgres:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    network_mode: bridge
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "${THESISTRACE_CORE_TEST_S3_PORT:-59010}:9000"
      - "${THESISTRACE_CORE_TEST_S3_CONSOLE_PORT:-59011}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ${THESISTRACE_CORE_TEST_DATA_ROOT:-/private/tmp/thesistrace-core-test-data}/rustfs:/data
