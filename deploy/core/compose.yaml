x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-core-environment: &core-environment
  THESISTRACE_DATABASE_URL: postgresql://core_runtime:${THESISTRACE_CORE_DATABASE_PASSWORD:?THESISTRACE_CORE_DATABASE_PASSWORD is required}@postgres:5432/thesistrace
  THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN:?THESISTRACE_PUBLIC_ORIGIN is required}
  THESISTRACE_S3_ENDPOINT_URL: http://rustfs:9000
  THESISTRACE_S3_ACCESS_KEY_ID: rustfsadmin
  THESISTRACE_S3_SECRET_ACCESS_KEY: rustfsadmin
  THESISTRACE_S3_BUCKET: thesistrace-local
  THESISTRACE_S3_REGION: us-east-1
  THESISTRACE_DATA_MOUNT: /var/lib/thesistrace/canonical-data
  THESISTRACE_BATCH_ATTEMPT_CONTROL_DIRECTORY: /var/lib/thesistrace/.batch-attempts
  THESISTRACE_RESEARCH_WORKER_EXECUTION_MEMORY_BYTES: ${THESISTRACE_RESEARCH_WORKER_EXECUTION_MEMORY_BYTES:-1610612736}
  THESISTRACE_TRACKING_WORKER_EXECUTION_MEMORY_BYTES: ${THESISTRACE_TRACKING_WORKER_EXECUTION_MEMORY_BYTES:-1610612736}

x-backend: &backend
  build:
    context: ../..
    dockerfile: deploy/core/Dockerfile.backend
  environment: *core-environment
  init: true
  volumes:
    - canonical-data:/var/lib/thesistrace/canonical-data

x-auth-image: &auth-image
  build:
    context: ../..
    dockerfile: deploy/core/Dockerfile.auth
  image: ${THESISTRACE_AUTH_IMAGE:?THESISTRACE_AUTH_IMAGE is required}

services:
  postgres:
    logging: *bounded-logging
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: thesistrace
      POSTGRES_USER: thesistrace_owner
      POSTGRES_PASSWORD: ${THESISTRACE_OWNER_DATABASE_PASSWORD:?THESISTRACE_OWNER_DATABASE_PASSWORD is required}
      THESISTRACE_CORE_DATABASE_PASSWORD: ${THESISTRACE_CORE_DATABASE_PASSWORD:?THESISTRACE_CORE_DATABASE_PASSWORD is required}
      THESISTRACE_AUTH_DATABASE_PASSWORD: ${THESISTRACE_AUTH_DATABASE_PASSWORD:?THESISTRACE_AUTH_DATABASE_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesistrace_owner -d thesistrace"]
      interval: 1s
      timeout: 5s
      retries: 180
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/010-runtime-roles.sh:/docker-entrypoint-initdb.d/010-runtime-roles.sh:ro

  rustfs:
    logging: *bounded-logging
    image: rustfs/rustfs:1.0.0-beta.12
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 1s
      timeout: 5s
      retries: 180
    volumes:
      - rustfs-data:/data

  auth-initialize:
    <<: *auth-image
    logging: *bounded-logging
    command: ["node", "dist/initialize.js"]
    environment:
      THESISTRACE_OWNER_DATABASE_URL: postgresql://thesistrace_owner:${THESISTRACE_OWNER_DATABASE_PASSWORD:?THESISTRACE_OWNER_DATABASE_PASSWORD is required}@postgres:5432/thesistrace
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    <<: *auth-image
    logging: *bounded-logging
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      THESISTRACE_AUTH_DATABASE_URL: postgresql://auth_runtime:${THESISTRACE_AUTH_DATABASE_PASSWORD:?THESISTRACE_AUTH_DATABASE_PASSWORD is required}@postgres:5432/thesistrace
      THESISTRACE_ENVIRONMENT: ${THESISTRACE_ENVIRONMENT:?THESISTRACE_ENVIRONMENT is required}
      THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN:?THESISTRACE_PUBLIC_ORIGIN is required}
      THESISTRACE_RESEND_API_URL: ${THESISTRACE_RESEND_API_URL:?THESISTRACE_RESEND_API_URL is required}
    depends_on:
      auth-initialize:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8200/health/live').then((response) => { if (!response.ok) process.exit(1) })
      interval: 2s
      timeout: 5s
      retries: 60

  initialize:
    <<: *backend
    logging: *bounded-logging
    command: ["thesistrace-initialize"]
    environment:
      <<: *core-environment
      THESISTRACE_DATABASE_URL: postgresql://thesistrace_owner:${THESISTRACE_OWNER_DATABASE_PASSWORD:?THESISTRACE_OWNER_DATABASE_PASSWORD is required}@postgres:5432/thesistrace
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    logging: *bounded-logging
    depends_on:
      initialize:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/live', timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 60

  research-worker:
    <<: *backend
    logging: *bounded-logging
    volumes:
      - canonical-data:/var/lib/thesistrace/canonical-data:ro
    command:
      - thesistrace-core-worker
      - --role
      - research
      - --cpu-count
      - ${THESISTRACE_RESEARCH_WORKER_CPU_COUNT:-2}
      - --memory-bytes
      - ${THESISTRACE_RESEARCH_WORKER_MEMORY_BYTES:-2147483648}
      - --execution-memory-bytes
      - ${THESISTRACE_RESEARCH_WORKER_EXECUTION_MEMORY_BYTES:-1610612736}
      - --calculation-threads
      - ${THESISTRACE_RESEARCH_WORKER_CALCULATION_THREADS:-2}
    cpus: ${THESISTRACE_RESEARCH_WORKER_CPU_COUNT:-2}
    mem_limit: ${THESISTRACE_RESEARCH_WORKER_MEMORY_BYTES:-2147483648}
    depends_on:
      initialize:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: *core-environment
      OMP_NUM_THREADS: ${THESISTRACE_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${THESISTRACE_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      MKL_NUM_THREADS: ${THESISTRACE_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${THESISTRACE_RESEARCH_WORKER_CALCULATION_THREADS:-2}

  batch-research-worker:
    <<: *backend
    logging: *bounded-logging
    volumes:
      - canonical-data:/var/lib/thesistrace/canonical-data:ro
      - batch-attempt-control:/var/lib/thesistrace/.batch-attempts
    command:
      - thesistrace-core-worker
      - --role
      - batch-research
      - --cpu-count
      - ${THESISTRACE_BATCH_RESEARCH_WORKER_CPU_COUNT:-2}
      - --memory-bytes
      - ${THESISTRACE_BATCH_RESEARCH_WORKER_MEMORY_BYTES:-2147483648}
      - --execution-memory-bytes
      - ${THESISTRACE_BATCH_RESEARCH_WORKER_EXECUTION_MEMORY_BYTES:-1610612736}
      - --calculation-threads
      - ${THESISTRACE_BATCH_RESEARCH_WORKER_CALCULATION_THREADS:-2}
    cpus: ${THESISTRACE_BATCH_RESEARCH_WORKER_CPU_COUNT:-2}
    mem_limit: ${THESISTRACE_BATCH_RESEARCH_WORKER_MEMORY_BYTES:-2147483648}
    depends_on:
      initialize:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: *core-environment
      OMP_NUM_THREADS: ${THESISTRACE_BATCH_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${THESISTRACE_BATCH_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      MKL_NUM_THREADS: ${THESISTRACE_BATCH_RESEARCH_WORKER_CALCULATION_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${THESISTRACE_BATCH_RESEARCH_WORKER_CALCULATION_THREADS:-2}

  tracking-worker:
    <<: *backend
    logging: *bounded-logging
    command:
      - thesistrace-core-worker
      - --role
      - tracking
      - --cpu-count
      - ${THESISTRACE_TRACKING_WORKER_CPU_COUNT:-2}
      - --memory-bytes
      - ${THESISTRACE_TRACKING_WORKER_MEMORY_BYTES:-2147483648}
      - --execution-memory-bytes
      - ${THESISTRACE_TRACKING_WORKER_EXECUTION_MEMORY_BYTES:-1610612736}
      - --calculation-threads
      - ${THESISTRACE_TRACKING_WORKER_CALCULATION_THREADS:-2}
    cpus: ${THESISTRACE_TRACKING_WORKER_CPU_COUNT:-2}
    mem_limit: ${THESISTRACE_TRACKING_WORKER_MEMORY_BYTES:-2147483648}
    depends_on:
      initialize:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      <<: *core-environment
      OMP_NUM_THREADS: ${THESISTRACE_TRACKING_WORKER_CALCULATION_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${THESISTRACE_TRACKING_WORKER_CALCULATION_THREADS:-2}
      MKL_NUM_THREADS: ${THESISTRACE_TRACKING_WORKER_CALCULATION_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${THESISTRACE_TRACKING_WORKER_CALCULATION_THREADS:-2}

  web:
    logging: *bounded-logging
    build:
      context: ../..
      dockerfile: deploy/core/Dockerfile.web
    environment:
      THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_PUBLIC_ORIGIN:?THESISTRACE_PUBLIC_ORIGIN is required}
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /srv/index.html && wget -q -O /dev/null http://127.0.0.1:2019/config/
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  batch-attempt-control:
  canonical-data:
  postgres-data:
  rustfs-data:
