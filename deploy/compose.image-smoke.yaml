networks:
  default:
    internal: true
  edge:

services:
  rustfs:
    environment:
      RUSTFS_ACCESS_KEY: observability-access-canary
      RUSTFS_SECRET_KEY: observability-secret-canary

  auth:
    volumes:
      - ../apps/auth/test-fixtures:/test-fixtures:ro

  auth-fixture-control:
    networks:
      - default
      - edge

  initialize:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
      THESISTRACE_TEST_AUTH_SESSION_FILE: /smoke-secrets/auth-session.json
      THESISTRACE_BENCHMARK_MOUNT: /smoke-data/benchmark-data
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/smoke-data/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/smoke-data/benchmark-data
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/smoke-evidence
      - ${THESISTRACE_TEST_SECRET_DIR}:/smoke-secrets:ro
      - ../tests:/smoke/tests:ro
      - ../apps/agent/fixtures:/smoke/apps/agent/fixtures:ro
      - ../apps/core/tests:/smoke/apps/core/tests:ro
      - ../tooling/test/probe-rustfs-ready:/smoke/tooling/test/probe-rustfs-ready:ro
      - ../apps/core/benchmarks:/qualification:ro
      - ../apps/core/benchmarks:/benchmarks:ro
  api:
    command: ["python", "/smoke/tests/production_mcp_image_api.py"]
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
      THESISTRACE_BENCHMARK_MOUNT: /smoke-data/benchmark-data
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/smoke-data/canonical-data
      - ${THESISTRACE_TEST_BENCHMARK_MOUNT}:/smoke-data/benchmark-data
      - ../tests:/smoke/tests:ro
      - ../apps/agent/fixtures:/smoke/apps/agent/fixtures:ro
      - ../apps/core/tests:/smoke/apps/core/tests:ro
      - ../tooling/test/probe-rustfs-ready:/smoke/tooling/test/probe-rustfs-ready:ro
  research-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
      THESISTRACE_TEST_AUTH_SESSION_FILE: /smoke-secrets/auth-session.json
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/smoke-data/canonical-data:ro
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/qualification-evidence
      - ${THESISTRACE_TEST_SECRET_DIR}:/smoke-secrets:ro
      - ../apps/core/benchmarks:/qualification:ro
      - ../apps/core/benchmarks:/benchmarks:ro
  batch-research-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/smoke-data/canonical-data:ro
      - ${THESISTRACE_TEST_EVIDENCE_DIR}:/qualification-evidence
      - ../apps/core/benchmarks:/qualification:ro
      - ../apps/core/benchmarks:/benchmarks:ro
  tracking-worker:
    environment:
      THESISTRACE_S3_ACCESS_KEY_ID: observability-access-canary
      THESISTRACE_S3_SECRET_ACCESS_KEY: observability-secret-canary
      THESISTRACE_DATA_MOUNT: /smoke-data/canonical-data
    volumes:
      - ${THESISTRACE_TEST_DATA_MOUNT}:/smoke-data/canonical-data

  web:
    networks:
      - default
      - edge
