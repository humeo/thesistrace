global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: health-views
    metrics_path: /metrics
    static_configs:
      - targets: ["health-service:8020"]

  - job_name: service-probes
    metrics_path: /metrics
    static_configs:
      - targets:
          - "execution-relay:9100"
          - "data-worker:9100"
          - "compute-worker-1:9100"
          - "compute-worker-2:9100"
          - "compute-worker-3:9100"
          - "compute-worker-4:9100"
          - "tushare-egress:9100"

  - job_name: object-store
    metrics_path: /metrics
    static_configs:
      - targets: ["object-store:8010"]

  - job_name: otel-application-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
