x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: thesistrace/app:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
  environment: &app-environment
    THESISTRACE_RELEASE_VERSION: ${THESISTRACE_RELEASE_VERSION:-0.1.0}
    THESISTRACE_RUNTIME_MODE: ${THESISTRACE_RUNTIME_MODE:-hosted}
    THESISTRACE_AUTH_MODE: insforge
    THESISTRACE_INSFORGE_JWKS_URL: http://insforge:7130/.well-known/jwks.json
    THESISTRACE_INSFORGE_JWT_ISSUER: insforge
    THESISTRACE_INSFORGE_JWT_AUDIENCE: thesistrace
    THESISTRACE_HOME: /var/lib/thesistrace
    THESISTRACE_API_HOST: 0.0.0.0
  restart: unless-stopped
  logging: *bounded-logging

x-startup-dependency: &startup-dependency
  thesistrace-migrations:
    condition: service_completed_successfully

services:
  volume-permissions:
    <<: *app
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "chown -R 10001:11000 /var/lib/thesistrace/working-cache && chmod -R 2770 /var/lib/thesistrace/working-cache && chown -R 10005:10005 /var/lib/thesistrace/objects",
      ]
    networks: [control]
    volumes:
      - working-cache:/var/lib/thesistrace/working-cache
      - immutable-objects:/var/lib/thesistrace/objects
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: "no"

  postgres:
    image: ghcr.io/insforge/postgres:v15.13.4
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c app.encryption_key=$$APP_ENCRYPTION_KEY
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insforge}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [control]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/jwt.sql:/docker-entrypoint-initdb.d/02-jwt.sql:ro
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_encryption_key
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.2
    logging: *bounded-logging

  insforge-migrations:
    image: thesistrace/insforge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/sbin/tini", "--"]
    command: ["sh", "-c", "cd backend && npm run migrate:up"]
    environment: &insforge-environment
      PORT: "7130"
      API_BASE_URL: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
      JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
      ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
      ROOT_ADMIN_USERNAME: ${INSFORGE_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD_FILE: /run/secrets/insforge_admin_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL_FILE: /run/secrets/insforge_database_url
      POSTGREST_BASE_URL: http://postgrest:3000
      DENO_RUNTIME_URL: http://deno:7133
      STORAGE_DIR: /insforge-storage
      LOGS_DIR: /insforge-logs
      INSFORGE_TELEMETRY_DISABLED: "1"
      INSFORGE_DEPLOYMENT_METHOD: docker-compose
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_jwt_secret
      - insforge_encryption_key
      - insforge_admin_password
      - insforge_database_url
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.2
    restart: "no"
    logging: *bounded-logging

  thesistrace-migrations:
    <<: *app
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.app
    command: ["python", "-m", "thesistrace.hosted.migrations"]
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: ${POSTGRES_USER:-postgres}
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      THESISTRACE_INJECT_MIGRATION_FAILURE: ${THESISTRACE_INJECT_MIGRATION_FAILURE:-0}
      THESISTRACE_MIGRATIONS_DIR: /app/deploy/hosted/migrations
    depends_on:
      insforge-migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    networks: [control]
    secrets:
      - postgres_password
      - api_database_password
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.12
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command: ["postgrest"]
    environment:
      PGRST_DB_URI_FILE: /run/secrets/insforge_database_url
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
    depends_on:
      <<: *startup-dependency
      postgres:
        condition: service_healthy
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - insforge_database_url
      - insforge_jwt_secret
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: unless-stopped
    logging: *bounded-logging

  deno:
    image: thesistrace/insforge-deno:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.deno
    environment:
      PORT: "7133"
      DENO_ENV: production
      DENO_DIR: /deno-dir
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGREST_BASE_URL: http://postgrest:3000
      WORKER_TIMEOUT_MS: "60000"
      ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
      JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command:
      [
        "/tini",
        "--",
        "docker-entrypoint.sh",
        "deno",
        "run",
        "--allow-net",
        "--allow-env",
        "--allow-read=./worker-template.js",
        "server.ts",
      ]
    depends_on:
      <<: *startup-dependency
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7133/health"]
      interval: 5s
      timeout: 20s
      retries: 40
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_encryption_key
      - insforge_jwt_secret
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: unless-stopped
    logging: *bounded-logging

  insforge:
    image: thesistrace/insforge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/sbin/tini", "--"]
    command: ["npm", "start"]
    environment:
      <<: *insforge-environment
    depends_on:
      <<: *startup-dependency
      postgrest:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7130/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 20s
      retries: 40
    networks: [control]
    volumes:
      - insforge-storage:/insforge-storage
      - insforge-logs:/insforge-logs
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_jwt_secret
      - insforge_encryption_key
      - insforge_admin_password
      - insforge_database_url
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.2
    restart: unless-stopped
    logging: *bounded-logging

  object-store:
    <<: *app
    command: ["thesistrace-object-store"]
    user: "10005:10005"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.3
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      THESISTRACE_OBJECT_STORE_ROOT: /var/lib/thesistrace/objects
      THESISTRACE_OBJECT_STORE_TOKENS_FILE: /run/secrets/object_store_tokens
    depends_on:
      <<: *startup-dependency
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=15)",
        ]
      interval: 5s
      timeout: 20s
      retries: 40
    networks:
      - storage
    volumes:
      - immutable-objects:/var/lib/thesistrace/objects
    secrets:
      - object_store_tokens

  api:
    <<: *app
    user: "10001:10001"
    group_add: ["11000"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_api
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: api
      THESISTRACE_OBJECT_STORE_URL: http://object-store:8010
      THESISTRACE_OBJECT_STORE_TOKEN_FILE: /run/secrets/object_store_api_token
      THESISTRACE_API_RATE_LIMIT_WINDOW_SECONDS: ${THESISTRACE_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      THESISTRACE_API_USER_REQUEST_LIMIT: ${THESISTRACE_API_USER_REQUEST_LIMIT:-120}
      THESISTRACE_API_WORKSPACE_REQUEST_LIMIT: ${THESISTRACE_API_WORKSPACE_REQUEST_LIMIT:-240}
      THESISTRACE_API_MUTATION_REQUEST_LIMIT: ${THESISTRACE_API_MUTATION_REQUEST_LIMIT:-30}
    depends_on:
      <<: *startup-dependency
      object-store:
        condition: service_healthy
    networks:
      - control
      - storage
    volumes:
      - working-cache:/var/lib/thesistrace/working-cache
    secrets:
      - api_database_password
      - object_store_api_token
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=15)",
        ]
      interval: 5s
      timeout: 20s
      retries: 40
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.15

  tushare-egress:
    <<: *app
    command: ["thesistrace-tushare-egress"]
    user: "10006:10006"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment: {}
    networks:
      - tushare-egress
      - data-egress

  edge:
    image: thesistrace/edge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.edge
    environment:
      THESISTRACE_SITE_ADDRESS: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
      THESISTRACE_ORIGIN_TLS: ${THESISTRACE_ORIGIN_TLS:-/run/secrets/origin-tls/cert.pem /run/secrets/origin-tls/key.pem}
      THESISTRACE_EDGE_TRUSTED_PROXIES: >-
        ${THESISTRACE_EDGE_TRUSTED_PROXIES:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      <<: *startup-dependency
      api:
        condition: service_healthy
      insforge:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${THESISTRACE_HTTP_PORT:-80}"
        protocol: tcp
      - target: 8443
        published: "${THESISTRACE_HTTPS_PORT:-443}"
        protocol: tcp
    networks:
      - edge
      - control
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ${THESISTRACE_ORIGIN_TLS_DIR:-.hosted/origin-tls}:/run/secrets/origin-tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/ready"]
      interval: 5s
      timeout: 20s
      retries: 40
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    logging: *bounded-logging

secrets:
  postgres_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/postgres_password
  insforge_jwt_secret:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_jwt_secret
  insforge_encryption_key:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_encryption_key
  insforge_admin_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_admin_password
  insforge_database_url:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_database_url
  api_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/api_database_password
  object_store_tokens:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_tokens
  object_store_api_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_api_token
  tushare_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/tushare_token

networks:
  edge:
    driver: bridge
  control:
    driver: bridge
    internal: true
  storage:
    driver: bridge
    internal: true
  tushare-egress:
    driver: bridge
    internal: true
  data-egress:
    driver: bridge

volumes:
  caddy-config:
  caddy-data:
  immutable-objects:
  insforge-logs:
  insforge-storage:
  postgres-data:
  working-cache:
