x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  image: thesistrace/app:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
  environment: &app-environment
    THESISTRACE_RELEASE_VERSION: ${THESISTRACE_RELEASE_VERSION:-0.1.0}
    THESISTRACE_RELEASE_BUNDLE_ID: ${THESISTRACE_RELEASE_BUNDLE_ID:-dev}
    THESISTRACE_RUNTIME_MODE: ${THESISTRACE_RUNTIME_MODE:-hosted}
    THESISTRACE_AUTH_MODE: insforge
    THESISTRACE_INSFORGE_JWKS_URL: http://insforge:7130/.well-known/jwks.json
    THESISTRACE_INSFORGE_JWT_ISSUER: insforge
    THESISTRACE_INSFORGE_JWT_AUDIENCE: thesistrace
    THESISTRACE_HOME: /var/lib/thesistrace
    THESISTRACE_API_HOST: 0.0.0.0
    THESISTRACE_TEMPORAL_ADDRESS: temporal:7233
    THESISTRACE_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-thesistrace}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  restart: unless-stopped
  logging: *bounded-logging

x-release-dependency: &release-dependency
  release-gate:
    condition: service_completed_successfully

x-worker: &worker
  <<: *app
  command: ["thesistrace-worker", "--interval", "2"]
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  tmpfs:
    - /tmp:size=256m,mode=1777
  depends_on:
    <<: *release-dependency
    temporal-namespace:
      condition: service_completed_successfully
    api:
      condition: service_healthy

services:
  volume-permissions:
    <<: *app
    user: "0:0"
    command:
      [
        "sh",
        "-c",
        "chown -R 10001:11000 /var/lib/thesistrace/working-cache && chmod -R 2770 /var/lib/thesistrace/working-cache && chown -R 10005:10005 /var/lib/thesistrace/objects",
      ]
    networks: [control]
    volumes:
      - working-cache:/var/lib/thesistrace/working-cache
      - immutable-objects:/var/lib/thesistrace/objects
    restart: "no"

  postgres:
    image: ghcr.io/insforge/postgres:v15.13.4
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/bin/sh", "-c"]
    command:
      - >-
        exec docker-entrypoint.sh postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c app.encryption_key=$$APP_ENCRYPTION_KEY
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      APP_ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insforge}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [control]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/jwt.sql:/docker-entrypoint-initdb.d/02-jwt.sql:ro
      - ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}/deploy/docker-init/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_encryption_key
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.2
    logging: *bounded-logging

  temporal-postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD_FILE: /run/secrets/temporal_database_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER:-temporal}"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [execution]
    volumes:
      - temporal-data:/var/lib/postgresql/data
    secrets:
      - temporal_database_password
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.15
    logging: *bounded-logging

  insforge-migrations:
    image: thesistrace/insforge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: ${INSFORGE_SOURCE_DIR:-.hosted/insforge-v2.2.9}
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/sbin/tini", "--"]
    command: ["sh", "-c", "cd backend && npm run migrate:up"]
    environment: &insforge-environment
      PORT: "7130"
      API_BASE_URL: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
      JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
      ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
      ROOT_ADMIN_USERNAME: ${INSFORGE_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD_FILE: /run/secrets/insforge_admin_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_URL_FILE: /run/secrets/insforge_database_url
      POSTGREST_BASE_URL: http://postgrest:3000
      DENO_RUNTIME_URL: http://deno:7133
      STORAGE_DIR: /insforge-storage
      LOGS_DIR: /insforge-logs
      INSFORGE_TELEMETRY_DISABLED: "1"
      INSFORGE_DEPLOYMENT_METHOD: docker-compose
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_jwt_secret
      - insforge_encryption_key
      - insforge_admin_password
      - insforge_database_url
    restart: "no"
    logging: *bounded-logging

  temporal-schema:
    image: temporalio/admin-tools:1.31.0
    environment:
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD_FILE: /run/secrets/temporal_database_password
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command: ["/bin/sh", "/bootstrap/setup-postgres.sh"]
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks: [execution]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/temporal:/bootstrap:ro
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - temporal_database_password
    restart: "no"
    logging: *bounded-logging

  temporal:
    image: temporalio/server:1.31.0
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD_FILE: /run/secrets/temporal_database_password
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/dynamicconfig.yaml
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [execution]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/dynamicconfig.yaml:ro
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command: ["/etc/temporal/entrypoint.sh"]
    secrets:
      - temporal_database_password
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.25
    restart: unless-stopped
    logging: *bounded-logging

  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-thesistrace}
    entrypoint: ["/bin/sh"]
    command: ["/bootstrap/create-namespace.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    networks: [execution]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/temporal:/bootstrap:ro
    restart: "no"
    logging: *bounded-logging

  thesistrace-migrations:
    <<: *app
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.app
    command: ["python", "-m", "thesistrace.hosted.migrations"]
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: ${POSTGRES_USER:-postgres}
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      THESISTRACE_RELAY_DATABASE_PASSWORD_FILE: /run/secrets/relay_database_password
      THESISTRACE_DATA_DATABASE_PASSWORD_FILE: /run/secrets/data_database_password
      THESISTRACE_COMPUTE_DATABASE_PASSWORD_FILE: /run/secrets/compute_database_password
      THESISTRACE_HEALTH_DATABASE_PASSWORD_FILE: /run/secrets/health_database_password
      THESISTRACE_INJECT_MIGRATION_FAILURE: ${THESISTRACE_INJECT_MIGRATION_FAILURE:-0}
      THESISTRACE_MIGRATIONS_DIR: /app/deploy/hosted/migrations
    depends_on:
      postgres:
        condition: service_healthy
      volume-permissions:
        condition: service_completed_successfully
    networks: [control, execution]
    secrets:
      - postgres_password
      - api_database_password
      - relay_database_password
      - data_database_password
      - compute_database_password
      - health_database_password
    restart: "no"

  release-gate:
    <<: *app
    command: ["python", "-m", "thesistrace.hosted.release_gate"]
    environment:
      <<: *app-environment
      THESISTRACE_RELEASE_BUNDLE_ROOT: /run/thesistrace-release
    depends_on:
      insforge-migrations:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      thesistrace-migrations:
        condition: service_completed_successfully
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_BUNDLE_DIR:-.hosted/releases}:/run/thesistrace-release:ro
    restart: "no"

  postgrest:
    image: postgrest/postgrest:v12.2.12
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command: ["postgrest"]
    environment:
      PGRST_DB_URI_FILE: /run/secrets/insforge_database_url
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
    depends_on:
      <<: *release-dependency
      postgres:
        condition: service_healthy
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - insforge_database_url
      - insforge_jwt_secret
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: unless-stopped
    logging: *bounded-logging

  deno:
    image: thesistrace/insforge-deno:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.deno
    environment:
      PORT: "7133"
      DENO_ENV: production
      DENO_DIR: /deno-dir
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGREST_BASE_URL: http://postgrest:3000
      WORKER_TIMEOUT_MS: "60000"
      ENCRYPTION_KEY_FILE: /run/secrets/insforge_encryption_key
      JWT_SECRET_FILE: /run/secrets/insforge_jwt_secret
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint"]
    command:
      [
        "/tini",
        "--",
        "docker-entrypoint.sh",
        "deno",
        "run",
        "--allow-net",
        "--allow-env",
        "--allow-read=./worker-template.js",
        "server.ts",
      ]
    depends_on:
      <<: *release-dependency
      postgrest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7133/health"]
      interval: 5s
      timeout: 3s
      retries: 40
    networks: [control]
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_encryption_key
      - insforge_jwt_secret
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: unless-stopped
    logging: *bounded-logging

  insforge:
    image: thesistrace/insforge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/thesistrace-secret-entrypoint", "/sbin/tini", "--"]
    command: ["npm", "start"]
    environment:
      <<: *insforge-environment
    depends_on:
      <<: *release-dependency
      postgrest:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7130/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
    networks: [control]
    volumes:
      - insforge-storage:/insforge-storage
      - insforge-logs:/insforge-logs
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/secret-entrypoint.sh:/usr/local/bin/thesistrace-secret-entrypoint:ro
    secrets:
      - postgres_password
      - insforge_jwt_secret
      - insforge_encryption_key
      - insforge_admin_password
      - insforge_database_url
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.2
    restart: unless-stopped
    logging: *bounded-logging

  object-store:
    <<: *app
    command: ["thesistrace-object-store"]
    user: "10005:10005"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.3
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      THESISTRACE_OBJECT_STORE_ROOT: /var/lib/thesistrace/objects
      THESISTRACE_PERSISTENT_DISK_BYTES: ${THESISTRACE_PERSISTENT_DISK_BYTES:-200000000000}
      THESISTRACE_DISK_WARNING_PERCENT: ${THESISTRACE_DISK_WARNING_PERCENT:-70}
      THESISTRACE_PRIVATE_WRITE_REJECTION_PERCENT: ${THESISTRACE_PRIVATE_WRITE_REJECTION_PERCENT:-80}
      THESISTRACE_ALL_WRITE_REJECTION_PERCENT: ${THESISTRACE_ALL_WRITE_REJECTION_PERCENT:-90}
      THESISTRACE_OBJECT_STORE_TOKENS_FILE: /run/secrets/object_store_tokens
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      <<: *release-dependency
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
    networks:
      - storage
      - observability
    volumes:
      - immutable-objects:/var/lib/thesistrace/objects
    secrets:
      - object_store_tokens

  api:
    <<: *app
    user: "10001:10001"
    group_add: ["11000"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_api
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: api
      THESISTRACE_OBJECT_STORE_URL: http://object-store:8010
      THESISTRACE_OBJECT_STORE_TOKEN_FILE: /run/secrets/object_store_api_token
      THESISTRACE_API_RATE_LIMIT_WINDOW_SECONDS: ${THESISTRACE_API_RATE_LIMIT_WINDOW_SECONDS:-60}
      THESISTRACE_API_USER_REQUEST_LIMIT: ${THESISTRACE_API_USER_REQUEST_LIMIT:-120}
      THESISTRACE_API_WORKSPACE_REQUEST_LIMIT: ${THESISTRACE_API_WORKSPACE_REQUEST_LIMIT:-240}
      THESISTRACE_API_MUTATION_REQUEST_LIMIT: ${THESISTRACE_API_MUTATION_REQUEST_LIMIT:-30}
    depends_on:
      <<: *release-dependency
      object-store:
        condition: service_healthy
    networks:
      - control
      - observability
      - storage
    volumes:
      - working-cache:/var/lib/thesistrace/working-cache
    secrets:
      - api_database_password
      - object_store_api_token
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=15)",
        ]
      interval: 5s
      timeout: 20s
      retries: 40
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.15

  execution-relay:
    <<: *app
    command: ["thesistrace-execution-relay", "--interval", "1"]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_relay
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/relay_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: relay
      THESISTRACE_SERVICE_SLOT: relay-1
    depends_on:
      <<: *release-dependency
      temporal-namespace:
        condition: service_completed_successfully
    networks:
      - control
      - execution
      - observability
    secrets:
      - relay_database_password
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1

  tushare-egress:
    <<: *app
    command: ["thesistrace-tushare-egress"]
    user: "10006:10006"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment: {}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 30s
      retries: 20
    networks:
      - tushare-egress
      - data-egress
      - observability

  data-worker:
    <<: *worker
    command: ["thesistrace-data-worker"]
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_data
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/data_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: data
      THESISTRACE_OBJECT_STORE_URL: http://object-store:8010
      THESISTRACE_OBJECT_STORE_TOKEN_FILE: /run/secrets/object_store_data_token
      TUSHARE_TOKEN_FILE: /run/secrets/tushare_token
      HTTPS_PROXY: http://tushare-egress:8080
      THESISTRACE_SERVICE_SLOT: data-1
    user: "10003:10003"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    networks:
      - control
      - execution
      - observability
      - storage
      - tushare-egress
    depends_on:
      <<: *release-dependency
      temporal-namespace:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      tushare-egress:
        condition: service_healthy
    secrets:
      - data_database_password
      - object_store_data_token
      - tushare_token
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 10s
      retries: 40

  compute-worker-1:
    <<: *worker
    command: &compute-command
      ["thesistrace-temporal-worker"]
    environment: &compute-environment
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_compute
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/compute_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: compute
      THESISTRACE_OBJECT_STORE_URL: http://object-store:8010
      THESISTRACE_OBJECT_STORE_TOKEN_FILE: /run/secrets/object_store_compute_token
      THESISTRACE_COMPUTE_SLOT_PREFERENCE: p1
      THESISTRACE_COMPUTE_WORKFLOW_POLLER: "true"
      THESISTRACE_SERVICE_SLOT: compute-p1-1
    user: &compute-user "10004:10004"
    group_add: &compute-groups ["11000"]
    mem_limit: &compute-memory 1g
    memswap_limit: &compute-memory-swap 1g
    cpus: &compute-cpus 0.75
    networks: &compute-networks
      - control
      - execution
      - observability
      - storage
    volumes: &compute-volumes
      - working-cache:/var/lib/thesistrace/working-cache
    healthcheck: &compute-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
    secrets: &compute-secrets
      - compute_database_password
      - object_store_compute_token

  compute-worker-2:
    <<: *worker
    command: *compute-command
    environment:
      <<: *compute-environment
      THESISTRACE_COMPUTE_WORKFLOW_POLLER: "false"
      THESISTRACE_SERVICE_SLOT: compute-p1-2
    user: *compute-user
    group_add: *compute-groups
    mem_limit: *compute-memory
    memswap_limit: *compute-memory-swap
    cpus: *compute-cpus
    networks: *compute-networks
    volumes: *compute-volumes
    healthcheck: *compute-healthcheck
    secrets: *compute-secrets

  compute-worker-3:
    <<: *worker
    command: *compute-command
    environment:
      <<: *compute-environment
      THESISTRACE_COMPUTE_WORKFLOW_POLLER: "false"
      THESISTRACE_SERVICE_SLOT: compute-p1-3
    user: *compute-user
    group_add: *compute-groups
    mem_limit: *compute-memory
    memswap_limit: *compute-memory-swap
    cpus: *compute-cpus
    networks: *compute-networks
    volumes: *compute-volumes
    healthcheck: *compute-healthcheck
    secrets: *compute-secrets

  compute-worker-4:
    <<: *worker
    command: *compute-command
    environment:
      <<: *compute-environment
      THESISTRACE_COMPUTE_SLOT_PREFERENCE: p3
      THESISTRACE_COMPUTE_WORKFLOW_POLLER: "false"
      THESISTRACE_SERVICE_SLOT: compute-p3-1
    user: *compute-user
    group_add: *compute-groups
    mem_limit: *compute-memory
    memswap_limit: *compute-memory-swap
    cpus: *compute-cpus
    networks: *compute-networks
    volumes: *compute-volumes
    healthcheck: *compute-healthcheck
    secrets: *compute-secrets

  health-service:
    <<: *app
    command: ["thesistrace-health-service"]
    user: "10007:10007"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.2
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *app-environment
      THESISTRACE_DATABASE_USER: thesistrace_health
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/health_database_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_DATABASE_ROLE: health
      THESISTRACE_HEALTH_FAULT_PLANE: ${THESISTRACE_HEALTH_FAULT_PLANE:-}
      THESISTRACE_PUBLIC_ORIGIN: ${THESISTRACE_HEALTH_PUBLIC_ORIGIN:-${THESISTRACE_SITE_ADDRESS:-https://localhost}}
      THESISTRACE_PUBLIC_ORIGIN_HOST: ${THESISTRACE_HEALTH_PUBLIC_ORIGIN_HOST:-}
      THESISTRACE_PUBLIC_ORIGIN_INSECURE: ${THESISTRACE_HEALTH_PUBLIC_ORIGIN_INSECURE:-false}
      THESISTRACE_RELEASE_FRESHNESS_MAX_SECONDS: ${THESISTRACE_RELEASE_FRESHNESS_MAX_SECONDS:-345600}
      THESISTRACE_DISK_WARNING_PERCENT: ${THESISTRACE_DISK_WARNING_PERCENT:-70}
      THESISTRACE_BACKUP_STATUS_FILE: /run/thesistrace-backup/backup-status.json
    depends_on:
      <<: *release-dependency
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
    networks:
      - edge
      - control
      - execution
      - observability
      - storage
      - tushare-egress
    volumes:
      - ${THESISTRACE_BACKUP_STATUS_DIR:-.hosted/backup-health}:/run/thesistrace-backup:ro
    secrets:
      - health_database_password

  backup-tool:
    image: thesistrace/app:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    profiles: [operator]
    command: ["python", "-m", "thesistrace.hosted.backup_cli"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    network_mode: none
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - postgres-data:/backup/source/postgres-data:ro
      - temporal-data:/backup/source/temporal-data:ro
      - immutable-objects:/backup/source/immutable-objects:ro
      - insforge-storage:/backup/source/insforge-storage:ro
      - ${THESISTRACE_RELEASE_BUNDLE_DIR:-.hosted/releases}:/backup/source/release-state:ro
      - ${THESISTRACE_RECOVERY_DIR:-.hosted/recovery}:/backup/source/secret-recovery:ro
      - ${THESISTRACE_OFF_NODE_BACKUP_DIR:-.hosted/off-node-backups}:/backup/off-node
      - ${THESISTRACE_BACKUP_STATUS_DIR:-.hosted/backup-health}:/backup/status
    secrets:
      - backup_passphrase
    restart: "no"
    logging: *bounded-logging

  restore-tool:
    image: thesistrace/app:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    profiles: [operator]
    command: ["python", "-m", "thesistrace.hosted.backup_cli"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    network_mode: none
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - postgres-data:/restore/volumes/postgres-data
      - temporal-data:/restore/volumes/temporal-data
      - immutable-objects:/restore/volumes/immutable-objects
      - insforge-storage:/restore/volumes/insforge-storage
      - working-cache:/restore/working-cache
      - ${THESISTRACE_RELEASE_BUNDLE_DIR:-.hosted/releases}:/restore/metadata/release-state
      - ${THESISTRACE_RECOVERY_DIR:-.hosted/recovery}:/restore/secrets
      - ${THESISTRACE_SECRET_DIR:-.hosted/secrets}:/restore/secret-files
      - ${THESISTRACE_OFF_NODE_BACKUP_DIR:-.hosted/off-node-backups}:/backup/off-node:ro
      - ${THESISTRACE_BACKUP_STATUS_DIR:-.hosted/backup-health}:/restore/status
    secrets:
      - backup_passphrase
      - recovery_passphrase
    restart: "no"
    logging: *bounded-logging

  restore-gate:
    image: thesistrace/app:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    profiles: [operator]
    command: ["python", "-m", "thesistrace.hosted.backup_cli", "verify-restore"]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      THESISTRACE_DATABASE_HOST: postgres
      THESISTRACE_DATABASE_PORT: "5432"
      THESISTRACE_DATABASE_USER: ${POSTGRES_USER:-postgres}
      THESISTRACE_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      THESISTRACE_DATABASE_NAME: ${POSTGRES_DB:-insforge}
      THESISTRACE_OBJECT_STORE_ROOT: /var/lib/thesistrace/objects
    networks: [control]
    volumes:
      - immutable-objects:/var/lib/thesistrace/objects:ro
      - ${THESISTRACE_BACKUP_STATUS_DIR:-.hosted/backup-health}:/run/thesistrace-backup
    secrets:
      - postgres_password
    restart: "no"
    logging: *bounded-logging

  recovery-probe:
    <<: *app
    profiles: [operator]
    command: ["thesistrace-recovery-probe"]
    user: "10004:10004"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [execution]
    restart: "no"
    logging: *bounded-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      THESISTRACE_EXTERNAL_OTLP_ENDPOINT: ${THESISTRACE_EXTERNAL_OTLP_ENDPOINT:-http://127.0.0.1:4319}
      THESISTRACE_EXTERNAL_OTLP_INSECURE: ${THESISTRACE_EXTERNAL_OTLP_INSECURE:-true}
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [observability]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    logging: *bounded-logging

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      <<: *release-dependency
      otel-collector:
        condition: service_started
    networks: [observability]
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.05
    logging: *bounded-logging

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ${THESISTRACE_RELEASE_CONFIG_ROOT:-./deploy/hosted}/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      <<: *release-dependency
      prometheus:
        condition: service_started
    networks:
      - observability
      - operator
    secrets:
      - grafana_admin_password
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.05
    logging: *bounded-logging

  edge:
    image: thesistrace/edge:${THESISTRACE_RELEASE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: deploy/hosted/Dockerfile.edge
    environment:
      THESISTRACE_SITE_ADDRESS: ${THESISTRACE_SITE_ADDRESS:-https://localhost}
      THESISTRACE_ORIGIN_TLS: ${THESISTRACE_ORIGIN_TLS:-/run/secrets/origin-tls/cert.pem /run/secrets/origin-tls/key.pem}
      THESISTRACE_EDGE_TRUSTED_PROXIES: >-
        ${THESISTRACE_EDGE_TRUSTED_PROXIES:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      <<: *release-dependency
      api:
        condition: service_healthy
      insforge:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${THESISTRACE_HTTP_PORT:-80}"
        protocol: tcp
      - target: 8443
        published: "${THESISTRACE_HTTPS_PORT:-443}"
        protocol: tcp
    networks:
      - edge
      - control
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ${THESISTRACE_ORIGIN_TLS_DIR:-.hosted/origin-tls}:/run/secrets/origin-tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/ready"]
      interval: 5s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    logging: *bounded-logging

secrets:
  postgres_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/postgres_password
  temporal_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/temporal_database_password
  insforge_jwt_secret:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_jwt_secret
  insforge_encryption_key:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_encryption_key
  insforge_admin_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_admin_password
  insforge_database_url:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/insforge_database_url
  grafana_admin_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/grafana_admin_password
  api_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/api_database_password
  relay_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/relay_database_password
  data_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/data_database_password
  compute_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/compute_database_password
  health_database_password:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/health_database_password
  object_store_tokens:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_tokens
  object_store_api_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_api_token
  object_store_compute_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_compute_token
  object_store_data_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/object_store_data_token
  tushare_token:
    file: ${THESISTRACE_SECRET_DIR:-.hosted/secrets}/tushare_token
  backup_passphrase:
    file: ${THESISTRACE_BACKUP_PASSPHRASE_FILE:-.hosted/backup-passphrase}
  recovery_passphrase:
    file: ${THESISTRACE_RECOVERY_PASSPHRASE_FILE:-.hosted/recovery-passphrase}

networks:
  edge:
    driver: bridge
  operator:
    driver: bridge
  control:
    driver: bridge
    internal: true
  execution:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true
  storage:
    driver: bridge
    internal: true
  tushare-egress:
    driver: bridge
    internal: true
  data-egress:
    driver: bridge

volumes:
  caddy-config:
  caddy-data:
  grafana-data:
  immutable-objects:
  insforge-logs:
  insforge-storage:
  postgres-data:
  prometheus-data:
  temporal-data:
  working-cache:
