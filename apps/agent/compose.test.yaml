x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-agent-image: &agent-image
  build:
    context: ../..
    dockerfile: apps/agent/Dockerfile
  image: ${THESISTRACE_AGENT_TEST_IMAGE}

services:
  postgres:
    entrypoint: ["/bin/sh", "/fixtures/hold-postgres-initialization"]
    command: ["postgres"]
    image: postgres:16.10-alpine
    logging: *bounded-logging
    environment:
      POSTGRES_DB: thesistrace
      POSTGRES_USER: thesistrace_owner
      POSTGRES_PASSWORD: owner-test-password
      THESISTRACE_CORE_DATABASE_PASSWORD: core-test-password
      THESISTRACE_AUTH_DATABASE_PASSWORD: auth-test-password
      THESISTRACE_AGENT_DATABASE_PASSWORD: agent-test-password
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = postgres && pg_isready -U thesistrace_owner -d thesistrace
      interval: 1s
      timeout: 5s
      retries: 60
    ports:
      - 127.0.0.1::5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../deploy/postgres/010-runtime-roles.sh:/docker-entrypoint-initdb.d/010-runtime-roles.sh:ro
      - ./test-fixtures/hold-postgres-initialization:/fixtures/hold-postgres-initialization:ro

  auth-stub:
    image: node:24.22.1-bookworm-slim@sha256:1681862882da07ee5476fee047bcf34138833f1df42633bb25bcb0f438d5bf3d
    logging: *bounded-logging
    command: ["node", "/test-fixtures/auth-mcp-stub.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8200/internal/session/verify',{method:'POST',headers:{cookie:'thesistrace.session_token=image-smoke-session'}}).then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ./test-fixtures:/test-fixtures:ro

  provider-stub:
    image: node:24.22.1-bookworm-slim@sha256:1681862882da07ee5476fee047bcf34138833f1df42633bb25bcb0f438d5bf3d
    logging: *bounded-logging
    command: ["node", "/test-fixtures/openai-provider-stub.mjs"]
    environment:
      THESISTRACE_AGENT_TEST_OPENAI_API_KEY: ${THESISTRACE_AGENT_TEST_OPENAI_SECRET:?THESISTRACE_AGENT_TEST_OPENAI_SECRET is required}
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8600/health/ready').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - ./test-fixtures:/test-fixtures:ro

  agent-initialize:
    <<: *agent-image
    logging: *bounded-logging
    command: ["node", "dist/initialize.js"]
    environment:
      THESISTRACE_OWNER_DATABASE_URL: postgresql://thesistrace_owner:owner-test-password@postgres:5432/thesistrace
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    <<: *agent-image
    logging: *bounded-logging
    environment:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      OPENAI_BASE_URL: http://provider-stub:8600/v1
      THESISTRACE_AGENT_BUILD_REVISION: image-smoke
      THESISTRACE_AGENT_DATABASE_URL: postgresql://agent_runtime:agent-test-password@postgres:5432/thesistrace
      THESISTRACE_AGENT_MODEL_REGISTRY: ${THESISTRACE_AGENT_TEST_MODEL_REGISTRY:?THESISTRACE_AGENT_TEST_MODEL_REGISTRY is required}
      THESISTRACE_AGENT_OPENAI_API_KEY: ${THESISTRACE_AGENT_TEST_OPENAI_SECRET:?THESISTRACE_AGENT_TEST_OPENAI_SECRET is required}
      THESISTRACE_AGENT_MODEL_SETTLEMENT_PATH: /app/agent/state/model-settlements.sqlite
      THESISTRACE_AGENT_RUN_MAX_WALL_SECONDS: "600"
      THESISTRACE_AUTH_INTERNAL_ORIGIN: http://auth-stub:8200
      THESISTRACE_ENVIRONMENT: production
      THESISTRACE_MCP_CLOCK_SKEW_SECONDS: "30"
      THESISTRACE_MCP_INTERNAL_URL: http://auth-stub:8500/mcp
      THESISTRACE_PUBLIC_ORIGIN: https://thesistrace.test
    depends_on:
      agent-initialize:
        condition: service_completed_successfully
      auth-stub:
        condition: service_healthy
      provider-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - --eval
        - fetch('http://127.0.0.1:8400/health/ready').then((response) => { if (!response.ok) process.exit(1) })
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - model-settlements:/app/agent/state
    ports:
      - 127.0.0.1::8400

volumes:
  model-settlements:
  postgres-data:
