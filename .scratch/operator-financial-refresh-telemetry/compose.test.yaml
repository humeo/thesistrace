services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: progress_test
      POSTGRES_PASSWORD: isolated-progress-test
      POSTGRES_DB: progress_test
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress_test -d progress_test"]
      interval: 1s
      timeout: 5s
      retries: 60
    volumes: ["progress-data:/var/lib/postgresql/data"]
volumes:
  progress-data:
