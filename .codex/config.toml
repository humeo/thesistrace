[mcp_servers.thesistrace]
command = "docker"
args = [
  "compose",
  "--project-name",
  "thesistrace-dev",
  "--env-file",
  "deploy/core/dev.env",
  "--file",
  "deploy/core/compose.yaml",
  "--file",
  "deploy/core/compose.dev.yaml",
  "exec",
  "--no-TTY",
  "--env",
  "THESISTRACE_RESEARCH_AGENT_RESEARCHER_ID",
  "api",
  "thesistrace-research-agent-mcp",
]
cwd = "/Users/koltenluca/code-github/thesistrace"
env_vars = ["THESISTRACE_RESEARCH_AGENT_RESEARCHER_ID"]
required = true
startup_timeout_sec = 20
tool_timeout_sec = 90
default_tools_approval_mode = "approve"
